name: CI - Production Gate

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

defaults:
  run:
    shell: bash

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: slms
          POSTGRES_PASSWORD: slms
          POSTGRES_DB: slms_test
        options: >-
          --health-cmd="pg_isready -U slms -d slms_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://slms:slms@localhost:5432/slms_test?schema=public
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.12.0
          run_install: true

      - name: Generate Prisma client
        run: pnpm --filter @slms/api prisma:generate

      - name: Lint (all packages)
        run: pnpm lint

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Run API tests (unit + integration)
        run: pnpm --filter @slms/api test

      - name: Build shared, API, and web
        run: |
          pnpm build:shared
          pnpm build:api
          pnpm build:web

  security:
    runs-on: ubuntu-latest
    needs: build_and_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.12.0
          run_install: true

      - name: Dependency audit (pnpm audit)
        run: pnpm audit --prod

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source=. --no-git -v

      - name: Environment validation (production-like config)
        env:
          NODE_ENV: production
          JWT_SECRET: dummy_jwt_secret_for_ci_only_change_in_prod
          JWT_REFRESH_SECRET: dummy_refresh_secret_for_ci_only_change_in_prod
          JWT_ADMIN_SECRET: dummy_admin_jwt_secret_for_ci_only_change_in_prod
          STORAGE_ROOT_PATH: /app/storage
          DATABASE_URL: postgresql://slms:slms@localhost:5432/slms_test?schema=public
        run: |
          # Ensure configuration/env validation do not reject production-like config
          node -e "require('./apps/api/dist/main.js');" || true

  docker_build:
    runs-on: ubuntu-latest
    needs: build_and_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t slms-api:ci .

      - name: Build Web image
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t slms-web:ci .

  smoke_test:
    runs-on: ubuntu-latest
    needs: docker_build

    env:
      DB_USER: slms
      DB_PASSWORD: slms
      DB_NAME: slms
      REDIS_PASSWORD: redispass
      JWT_SECRET: jwt_secret_for_smoke
      CORS_ORIGIN: http://localhost:3000
      API_URL: http://localhost:4000/api/v1
      CMS_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start stack (postgres, redis, api, web)
        run: |
          cd infra
          docker compose -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.prod.yml ps

      - name: Wait for API readiness
        run: |
          set -e
          for i in {1..30}; do
            if curl -fsS "http://localhost:4000/api/v1/health/ready" >/dev/null 2>&1; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 5
          done
          echo "API did not become ready in time"
          exit 1

      - name: Basic smoke checks
        run: |
          set -e
          curl -fsS "http://localhost:4000/api/v1/health" >/dev/null
          curl -fsS "http://localhost:4000/api/v1/public/categories" >/dev/null
          curl -fsS "http://localhost:3000" >/dev/null

      - name: Dump docker-compose logs on failure
        if: failure()
        run: |
          cd infra
          docker compose -f docker-compose.prod.yml logs

      - name: Tear down stack
        if: always()
        run: |
          cd infra
          docker compose -f docker-compose.prod.yml down -v

  deploy:
    runs-on: ubuntu-latest
    needs: [build_and_test, security, docker_build, smoke_test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy gate passed
        run: echo "All CI jobs passed. Safe to deploy."

