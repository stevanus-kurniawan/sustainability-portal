# Frontend server only (e.g. 172.28.92.56): Next.js web only.
# Usage: docker compose --env-file infra/.env.fe.dev -f infra/docker-compose.dev.frontend.yml up -d --build web
#
# IMPORTANT – If the server hangs during "up -d --build":
# The Next.js build uses a lot of RAM (often 1.5–2.5GB). On a small dev server this can exhaust
# memory and hang the machine. See docs/DEPLOY-DEV-FRONTEND-BUILD.md for workarounds:
# - Build the image on another machine (more RAM) and load it on the dev server, or
# - Add swap on the dev server before building, or
# - Use up -d without --build if the image was already built elsewhere.
#
# .env: API_URL, API_BACKEND_URL (optional), CMS_URL (optional).

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL}
        NEXT_PUBLIC_CMS_URL: ${CMS_URL:-}
        API_BACKEND_URL: ${API_BACKEND_URL:-}
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${API_URL}
      NEXT_PUBLIC_CMS_URL: ${CMS_URL:-}
      API_BACKEND_URL: ${API_BACKEND_URL:-}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-}
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  default:
    name: slms-network-dev-frontend
