# Frontend server only — DEVELOPMENT (Next.js web).
# Production equivalent: docker-compose.prod.frontend.yml + ./infra/up-prod-frontend.sh
#
# Recommended:
#   ./infra/up-dev-frontend.sh up -d --build web
#
# Routine deploy uses Docker layer cache (web Dockerfile: web+shared only, standalone runner, pnpm store cache).
# Use build --no-cache only when troubleshooting stale cache or dependency issues.
# If disk is low: ./infra/clean-dev-cache.sh
#
# Optimized for 8GB servers: NODE_OPTIONS and BUILD_LOW_MEMORY cap build RAM so the server
# doesn't hang. If build still OOMs, add swap (see docs/DEPLOY-DEV-FRONTEND-BUILD.md) or
# build the image elsewhere and run without --build.
#
# .env: API_URL, API_BACKEND_URL (optional), CMS_URL (optional).
# Optional: NODE_OPTIONS=--max-old-space-size=1024, BUILD_LOW_MEMORY=1 (stricter cap / single-thread webpack).

name: slms-dev-frontend

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL}
        NEXT_PUBLIC_CMS_URL: ${CMS_URL:-}
        API_BACKEND_URL: ${API_BACKEND_URL:-}
        # NODE_OPTIONS: override in .env.fe.dev to cap Node heap (e.g. 1024); Dockerfile default is 1536
        NODE_OPTIONS: ${NODE_OPTIONS}
        BUILD_LOW_MEMORY: ${BUILD_LOW_MEMORY:-1}
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${API_URL}
      NEXT_PUBLIC_CMS_URL: ${CMS_URL:-}
      API_BACKEND_URL: ${API_BACKEND_URL:-}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-}
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 512M
