# Backend server only — PRODUCTION (Postgres, Redis, API).
# Development equivalent: docker-compose.dev.backend.yml + ./infra/up-dev-backend.sh
#
# Create infra/env.prod.backend from env.example.backend and set all required variables.
# Recommended (loads infra/env.prod.backend):
#   ./infra/up-prod-backend.sh up -d --build api
#
# Routine deploy uses Docker layer cache. Use build --no-cache only when troubleshooting.
# If disk is low: ./infra/clean-dev-cache.sh
#
# Ports: DB host 5000, API host 8001. See env.example.backend for required variables.
# Project name isolates volumes from dev on the same host.

name: slms-prod-backend

services:
  postgres:
    image: postgres:16
    container_name: slms-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-slms}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-slms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-slms} -d ${DB_NAME:-slms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7
    container_name: slms-redis-prod
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: slms-api-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${DB_USER:-slms}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-slms}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET}
      JWT_ADMIN_EXPIRES_IN: ${JWT_ADMIN_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      STORAGE_ROOT_PATH: ${STORAGE_ROOT_PATH:-/app/storage}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-"false"}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WEB_URL: ${WEB_URL:-}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-}
      REGISTRATION_DOMAIN_RESTRICTION_ENABLED: ${REGISTRATION_DOMAIN_RESTRICTION_ENABLED:-true}
    ports:
      - "8001:3001"
    volumes:
      - ${STORAGE_HOST_PATH:-/mnt/nas/slms-docs}:/app/storage:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres_data:
  redis_data:
