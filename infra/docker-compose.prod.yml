version: '3.8'

# Production Docker Compose configuration
# Extends the base docker-compose.yml with production-specific settings

services:
  postgres:
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-slms}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-slms}
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M


  redis:
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Web Portal (Next.js)
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL}
      NEXT_PUBLIC_CMS_URL: ${CMS_URL}
    ports:
      - "3000:3000"
    depends_on:
      - api

  # API (NestJS)
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USER:-slms}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_NAME:-slms}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: slms-network-prod
