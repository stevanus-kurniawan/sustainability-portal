services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: slms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slms}
      POSTGRES_DB: ${POSTGRES_DB:-slms}
    ports:
      - "${POSTGRES_PORT:-5544}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slms -d slms"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7
    container_name: slms-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: slms-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: slms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set slms http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb slms/${MINIO_BUCKET:-slms-docs} --ignore-existing;
      mc anonymous set public slms/${MINIO_BUCKET:-slms-docs};
      echo 'Bucket ${MINIO_BUCKET:-slms-docs} created with public read/write access';
      exit 0;
      "

  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: slms-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"
      - "${MAILHOG_SMTP_PORT:-1025}:1025"

  # SLMS API (NestJS)
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: slms-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      # Allow any email when testing locally (set to "true" only in real production)
      REGISTRATION_DOMAIN_RESTRICTION_ENABLED: "false"
      PORT: 3001
      API_PREFIX: api/v1
      # Prisma engine path is set by docker-entrypoint.sh when present under apps/api
      DATABASE_URL: postgresql://${POSTGRES_USER:-slms}:${POSTGRES_PASSWORD:-slms}@postgres:5432/${POSTGRES_DB:-slms}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGINS: http://localhost:3000,http://localhost:3002,http://localhost:3001
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-replace-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret-replace-in-production}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:-your-admin-jwt-secret-replace-in-production}
      JWT_ADMIN_EXPIRES_IN: ${JWT_ADMIN_EXPIRES_IN:-8h}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-slms-docs}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_FROM: SLMS Notifications <noreply@slms.local>
      WEB_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # SLMS Web (Next.js)
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    container_name: slms-web
    restart: unless-stopped
    ports:
      # Use WEB_PORT (default 3002) so local dev on 3000 doesn't conflict
      - "${WEB_PORT:-3002}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Ensure server-side Next.js routes call the API by its Docker hostname.
      NEXT_PUBLIC_API_URL: http://slms-api:3001/api/v1
      # Hint to any code that wants to detect Dockerized web runtime.
      SLMS_DOCKER_WEB: "true"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  default:
    name: slms-network
