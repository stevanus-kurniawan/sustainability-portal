# NGINX reverse proxy - HTTP only (use when HTTPS is not set up yet)
# Proxies to backend app on port 8000.
#
# Backend: Use 127.0.0.1 or 172.28.80.50 when NGINX and the app run on the SAME
# host (avoids public IP / firewall). Use 147.139.176.70 when NGINX is on a
# different host and can reach the app via public IP.
#
# Port 80 is shared with other projects. This block is chosen when the request
# Host is sustainability.energi-up.com. Ensure:
# - This file is in sites-enabled (symlink from sites-available), or
# - For Docker: add this server block to the shared nginx-ssl.conf
# - The OTHER project's server block uses "listen 80 default_server;" so it
#   only catches requests that do NOT match this server_name

# Upstream: set backend in one place so the domain (port 80) proxies to app on 8000.
# - Same host, system NGINX: server 127.0.0.1:8000;
# - Same host, NGINX in Docker: use host IP, e.g. server 172.28.80.50:8000; (or host.docker.internal:8000 if available)
# - Different host: server 172.28.80.50:8000; or 147.139.176.70:8000; (private IP often works without opening public firewall)
upstream sustainability_backend {
    server 172.28.80.50:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name sustainability.energi-up.com;

    # Proxy to backend application (port 8000)
    location / {
        proxy_pass http://sustainability_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
