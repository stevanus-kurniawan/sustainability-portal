# NGINX reverse proxy for sustainability.kpndomain.com
# Proxies to backend at 172.28.80.50:8000 so users access the app without :8000
#
# Port 80 is shared with other projects. Routing is by server_name; ensure this
# file is in sites-enabled and the other project uses "listen 80 default_server;".
#
# Deployment:
# 1. Copy to /etc/nginx/sites-available/ (Debian/Ubuntu) or /etc/nginx/conf.d/
# 2. For HTTPS: Obtain certs (e.g. certbot) and update ssl_certificate paths below
# 3. Symlink: ln -s /etc/nginx/sites-available/sustainability.kpndomain.com.conf /etc/nginx/sites-enabled/
# 4. Test: nginx -t && systemctl reload nginx

# Redirect HTTP to HTTPS (uncomment when SSL is configured)
server {
    listen 80;
    listen [::]:80;
    server_name sustainability.kpndomain.com;

    # Optional: ACME challenge for Let's Encrypt (certbot) - keep this when using certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP to HTTPS (comment out until SSL is ready)
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sustainability.kpndomain.com;

    # SSL certificates (Let's Encrypt example paths)
    ssl_certificate     /etc/letsencrypt/live/sustainability.kpndomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sustainability.kpndomain.com/privkey.pem;

    # Optional: Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy to backend application
    location / {
        proxy_pass http://172.28.80.50:8000;
        proxy_http_version 1.1;

        # Preserve host and client info for backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if the app uses WebSockets)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;

        # Timeouts and buffers
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
