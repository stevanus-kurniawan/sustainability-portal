# NGINX reverse proxy - HTTP only (use when HTTPS is not set up yet)
# Proxies to backend at 172.28.80.50:8000
#
# Port 80 is shared with other projects. This block is chosen when the request
# Host is sustainability.kpndomain.com. Ensure:
# - This file is in sites-enabled (symlink from sites-available)
# - The OTHER project's server block uses "listen 80 default_server;" so it
#   only catches requests that do NOT match this server_name

server {
    listen 80;
    listen [::]:80;
    server_name sustainability.kpndomain.com;

    # Proxy to backend application (port 8000)
    location / {
        proxy_pass http://172.28.80.50:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
